<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Shop Stock (preview)</title>
<meta name="theme-color" content="#1B1B1D">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Shop Stock (preview)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Unbounded:wght@600;700&family=Noto+Sans+Ethiopic:wght@400;600;700&display=swap">
<style>
/* Shop Stock styles. Colors come from CSS variables that the app sets from the chosen mode and palette. */
:root{
  --font:'Inter','Noto Sans Ethiopic',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --bg:#F3F5F7; --surface:#FFFFFF; --ink:#0F1B2D; --muted:#566275; --line:#E1E6EC;
  --field-line:#8793A6; --accent:#0E7C66; --accent-ink:#FFFFFF; --accent-soft:#E2F3EE;
  --hero:#0F1B2D; --hero-ink:#FFFFFF; --hero-muted:#A9B6C6; --hero-line:#2B3A52;
  --bad:#B42318; --bad-bg:#FDE7E5; --warn:#7A4100; --warn-bg:#FFEBCF; --good:#0B6150; --good-bg:#E2F3EE;
  --seg:#E3E8EE; --scrim:rgba(15,27,45,.5);
  --gA-bg:#0B6150; --gA-fg:#FFFFFF; --gB-bg:#BFE6DA; --gB-fg:#0B3D33; --gC-bg:#FFE3A3; --gC-fg:#5C3B00;
  --gD-bg:#F4B58A; --gD-fg:#4A2000; --gE-bg:#D5DAE1; --gE-fg:#243044;
}
*{box-sizing:border-box}
html{color-scheme:light}
html[data-mode="dark"]{color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.4;padding-inline:16px;padding-block:calc(16px + env(safe-area-inset-top,0px)) 112px;-webkit-text-size-adjust:100%}
html[data-size="large"] body{zoom:1.14}
body.nonav{padding-bottom:40px}
#app{max-width:480px;margin-inline:auto;display:flex;flex-direction:column;gap:14px}
h1,h2,h3,p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
small{font-size:13px;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.top h1{font-size:24px;font-weight:800;letter-spacing:-.2px;overflow-wrap:anywhere}
.top .acts{display:flex;gap:8px;flex:none}
.sub{font-size:13px;color:var(--muted);margin-top:2px}
.pagehead{display:flex;align-items:center;gap:12px}
.pagehead h1{font-size:22px;font-weight:800;flex:1;min-width:0;overflow-wrap:anywhere}
.iconbtn{flex:none;width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:flex;align-items:center;justify-content:center;padding:0;position:relative}
.iconbtn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.badge{position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;border-radius:10px;background:var(--bad);color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 5px}
[data-mode="dark"] .badge{color:#1A0505}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px 16px}
.card.flush{padding-block:4px}
.card h3{font-size:16px;font-weight:700;margin-bottom:8px}
.cardhead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:4px}
.cardhead h3{margin:0}
.link{min-height:44px;padding:0 4px;border:none;background:transparent;color:var(--accent);font-weight:700;font-size:14px}
.hero{background:var(--hero);color:var(--hero-ink);border-radius:24px;padding:20px;display:flex;flex-direction:column;gap:16px;border:none;width:100%;text-align:left;font:inherit}
button.hero{cursor:pointer}
.hero .label{font-size:13px;color:var(--hero-muted)}
.hero .big{font-size:38px;font-weight:800;letter-spacing:-.5px;margin-top:4px}
.hero .big span{font-size:15px;font-weight:600;color:var(--hero-muted);margin-left:6px}
.hero .toprow{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.hero .stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;border-top:1px solid var(--hero-line);padding-top:14px}
.hero .stats b{display:block;font-size:16px;margin-top:2px}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;text-align:left;display:block;width:100%;color:var(--ink)}
.tile b{display:block;font-size:26px;font-weight:800}
.tile span{font-size:13px;color:var(--muted)}
.tiles2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.btn{min-height:48px;border-radius:14px;border:1px solid var(--field-line);background:var(--surface);color:var(--ink);font-weight:700;padding:0 16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.armed,.btn.dangerfill{background:var(--bad);color:#fff;border-color:var(--bad)}
[data-mode="dark"] .btn.armed,[data-mode="dark"] .btn.dangerfill{color:#1A0505}
.btn.sm{min-height:44px;font-size:14px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.wide{width:100%}
.btns{display:flex;gap:12px}
.btns>*{flex:1}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:44px;min-width:44px;padding:0 16px;border-radius:999px;border:1px solid var(--field-line);background:var(--surface);font-weight:600;font-size:14px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg{display:flex;gap:4px;padding:4px;border-radius:16px;background:var(--seg)}
.seg button{flex:1;min-height:44px;border-radius:12px;border:none;background:transparent;font-weight:700;font-size:14px;padding:0 6px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.search{display:flex;align-items:center;gap:10px;min-height:48px;border-radius:14px;border:1px solid var(--field-line);background:var(--surface);padding:0 14px;color:var(--muted)}
.search input{flex:1;min-width:0;border:none;background:transparent;outline:none;min-height:46px;color:var(--ink)}
.row{display:flex;align-items:center;gap:12px;width:100%;padding:12px 0;border:none;border-bottom:1px solid var(--line);background:transparent;text-align:left;min-height:64px;color:var(--ink)}
.row:last-child{border-bottom:none}
.row .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.row .grow b{font-weight:700;overflow-wrap:anywhere}
.row .end{text-align:right;display:flex;flex-direction:column;gap:2px;align-items:flex-end}
.row .end b{font-weight:800}
.row.off{opacity:.6}
.row.off .grow b{text-decoration:line-through}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.tag.bad{background:var(--bad-bg);color:var(--bad)}
.tag.warn{background:var(--warn-bg);color:var(--warn)}
.tag.good{background:var(--good-bg);color:var(--good)}
.tag.info{background:var(--accent-soft);color:var(--accent)}
.tag.gray{background:var(--seg);color:var(--muted)}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:3px}
.grade{flex:none;width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800}
.gA{background:var(--gA-bg);color:var(--gA-fg)}.gB{background:var(--gB-bg);color:var(--gB-fg)}.gC{background:var(--gC-bg);color:var(--gC-fg)}
.gD{background:var(--gD-bg);color:var(--gD-fg)}.gE{background:var(--gE-bg);color:var(--gE-fg)}
.stockn{font-size:22px;font-weight:800}
.banner{display:flex;align-items:center;gap:12px;background:var(--warn-bg);color:var(--warn);border-radius:16px;padding:12px 14px;font-size:13px}
.banner span{flex:1}
.banner button{flex:none;min-height:44px;padding:0 12px;border-radius:12px;border:1px solid currentColor;background:transparent;font-weight:700;color:inherit}
.okbox{background:var(--good-bg);color:var(--good);border-radius:16px;padding:12px 14px;font-size:14px;display:flex;gap:10px;align-items:flex-start}
.okbox span{flex:1}
.warnbox{background:var(--warn-bg);color:var(--warn);border-radius:14px;padding:10px 12px;font-size:13px;font-weight:600}
.empty{padding:22px 8px;text-align:center;color:var(--muted);font-size:14px}
.field{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea{width:100%;min-height:48px;border-radius:14px;border:1px solid var(--field-line);background:var(--surface);padding:0 14px;font-size:16px;color:var(--ink)}
.field textarea{padding:12px 14px;min-height:96px;resize:vertical}
.field small{font-weight:500}
.field.err input,.field.err textarea{border-color:var(--bad)}
.form{display:flex;flex-direction:column;gap:12px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 16px}
.facts div small{display:block}
.facts div b{display:block;margin-top:2px;overflow-wrap:anywhere}
.sum{display:flex;flex-direction:column;gap:10px}
.sum .l{display:flex;justify-content:space-between;gap:12px;font-size:14px}
.sum .l span:first-child{color:var(--muted)}
.sum .total{border-top:1px solid var(--line);padding-top:12px;display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.sum .total b{font-size:28px;font-weight:800;color:var(--accent)}
.sum .total b.out{color:var(--warn)}
.steps{display:flex;flex-direction:column;gap:8px;font-size:13px;line-height:1.4}
.steps div{display:flex;gap:10px;align-items:flex-start}
.steps svg{flex:none;margin-top:1px;color:var(--good)}
.err{background:var(--bad-bg);color:var(--bad);border-radius:12px;padding:10px 12px;font-size:14px;font-weight:600}
.scrim{position:fixed;inset:0;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;z-index:30}
.scrim.center{align-items:center;padding:16px;z-index:50}
.panel{width:100%;max-width:480px;max-height:92%;overflow-y:auto;background:var(--surface);color:var(--ink);border-radius:24px 24px 0 0;padding:16px 16px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;outline:none}
.scrim.center .panel{border-radius:24px;max-height:86%}
.panel .head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.panel h2{font-size:20px;font-weight:800;overflow-wrap:anywhere}
.divider{border:none;border-top:1px solid var(--line);margin:2px 0;width:100%}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:20;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px))}
.nav .in{max-width:480px;margin-inline:auto;display:flex;justify-content:space-around;align-items:flex-start}
.nav button{width:66px;min-height:56px;border:none;background:transparent;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:600;color:var(--muted);padding:0}
.nav button[aria-current="page"]{color:var(--accent);font-weight:700}
.nav .mid{margin-top:-26px}
.nav .mid .disc{width:56px;height:56px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(0,0,0,.28)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(100px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-size:14px;font-weight:600;z-index:60;max-width:calc(100% - 32px);text-align:center}
.catgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.catcard{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:112px;color:var(--ink)}
.catcard .ci{width:40px;height:40px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center}
.catcard b{font-size:16px}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:44px;height:44px;border-radius:12px;border:1px solid var(--field-line);background:var(--surface);font-size:20px;font-weight:700;line-height:1;padding:0}
.stepper b{min-width:28px;text-align:center}
.unitlist{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:14px;max-height:260px;overflow-y:auto}
.unit{display:flex;align-items:center;gap:12px;min-height:48px;padding:6px 12px;border-bottom:1px solid var(--line);font-size:15px;cursor:pointer}
.unit:last-child{border-bottom:none}
.unit input{width:22px;height:22px;flex:none;accent-color:var(--accent)}
.unit[hidden]{display:none}
.unit.taken{opacity:.5}
.dayhead{display:flex;justify-content:space-between;align-items:baseline;padding:14px 0 2px;font-size:13px;font-weight:700;color:var(--muted)}
.cartline{padding:12px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.cartline:last-child{border-bottom:none}
.cartline .top2{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.cartline .top2 b{overflow-wrap:anywhere}
.kv{display:flex;justify-content:space-between;gap:12px;padding:6px 0;font-size:14px}
.kv span:first-child{color:var(--muted)}
.swatches{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.swatch{border:2px solid var(--line);border-radius:16px;background:var(--surface);padding:10px;display:flex;flex-direction:column;gap:8px;align-items:flex-start;color:var(--ink);min-height:44px}
.swatch[aria-pressed="true"]{border-color:var(--accent)}
.swatch .dots{display:flex;gap:4px}
.swatch .dots i{width:22px;height:22px;border-radius:50%;display:block;border:1px solid rgba(128,128,128,.4)}
.swatch span{font-size:13px;font-weight:700}
.qa{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.qa button{min-height:76px;border-radius:18px;border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:6px;padding:12px 14px;font-weight:700;color:var(--ink);text-align:left}
.qa button .ci{color:var(--accent)}
.menulist{display:flex;flex-direction:column}
.menulist button{display:flex;align-items:center;gap:14px;min-height:60px;border:none;border-bottom:1px solid var(--line);background:transparent;text-align:left;width:100%;padding:8px 0;color:var(--ink)}
.menulist button:last-child{border-bottom:none}
.menulist .ci{width:40px;height:40px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;flex:none}
.menulist .grow{flex:1;min-width:0}
.menulist b{display:block}
.alert{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.alert:last-child{border-bottom:none}
.alert .dot{flex:none;width:10px;height:10px;border-radius:50%;margin-top:6px}
.alert .dot.bad{background:var(--bad)}.alert .dot.warn{background:#D98A00}.alert .dot.info{background:var(--accent)}
.alert .grow{flex:1;min-width:0}
.alert .grow b{display:block}
.alert .acts{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.alert .acts button{min-height:44px;padding:0 10px;border:none;background:transparent;color:var(--accent);font-weight:700;font-size:14px}
.alert .acts button.muted{color:var(--muted);font-weight:600}
.lockbox{min-height:60vh;display:flex;flex-direction:column;justify-content:center;gap:14px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:14px;overflow-wrap:anywhere}
.rcpt{white-space:pre-wrap;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:12px;overflow-wrap:anywhere}
.progress{height:8px;border-radius:4px;background:var(--seg);overflow:hidden}
.progress i{display:block;height:8px;background:var(--accent)}
@media (prefers-reduced-motion: no-preference){.panel{animation:rise .18s ease-out}@keyframes rise{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}}

/* v3: charcoal, wide headings, custom colors */
body{background-color:var(--bg)}
.top h1{font-family:'Unbounded','Inter',sans-serif;text-transform:uppercase;font-weight:700;font-size:21px;letter-spacing:-.01em}
.card,.flush,.tile{border:1.5px solid var(--line);box-shadow:none}
.hero{background:var(--surface)!important;border:1.5px solid var(--line);border-radius:24px;box-shadow:none}
.hero .big{font-weight:700;letter-spacing:-.04em}
.wk{display:flex;gap:8px;border-top:1px solid var(--line);padding-top:14px}
.wc{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;color:var(--hero-muted)}
.wb{width:100%;height:54px;border-radius:8px;background:var(--seg);display:flex;align-items:flex-end;overflow:hidden}
.wb i{display:block;width:100%;border-radius:8px;background:var(--bar);opacity:.55}.wc.on .wb i{opacity:1}.wc.on{color:var(--hero-ink);font-weight:700}
.cpick{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:6px 0 10px}.cpick label{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted)}
.cpick input{width:100%;height:46px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);padding:3px}
html[data-mode="dark"] .tab.add .plus,html[data-mode="dark"] .fab{background:#fff;color:#111}

</style>
</head>
<body>
<div id="app"></div>
<div id="sheetRoot"></div>
<div id="confRoot"></div>
<nav class="nav" id="nav" aria-label="Main"><div class="in" id="navIn"></div></nav>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<script>
(function(){
'use strict';
window.__REGISTER_SW__=false;
/* Shop Stock core: constants, helpers, icons, themes, saved data (load, migrate, save), example data, activity log. */
var KEY='shop-stock.preview', DAY=86400000, storageOK=true;
var db=null;
var CATS=['Phones','TVs','Computers','Audio','Accessories','Appliances','Networking','Gaming','Wearables','Cameras','Power'];
var DEV_CATS=['phone','tv','computer','other'];
var DEV_CAT_LABEL={phone:'Smartphones',tv:'TVs',computer:'Computers',other:'Others'};
var PART_TYPES={
  phone:['Motherboard','Screen','Battery','Speaker','Camera','Charging port','Back cover','Flex cable','Buttons','SIM tray','Other'],
  tv:['Main board','Power board','T-con board','Backlight strip','Panel','Remote','Speaker','Stand','Other'],
  computer:['Motherboard','Screen','Battery','Keyboard','RAM','SSD or HDD','Charger','Fan','Charging port','Other'],
  other:['Motherboard','Power board','Motor','Screen','Speaker','Other']
};
var APART_DEFAULTS={
  phone:[['Motherboard',4],['Screen',3],['Battery',1],['Speaker',1]],
  tv:[['Main board',3],['Power board',2],['T-con board',1],['Speaker',1]],
  computer:[['Motherboard',4],['Screen',3],['Battery',1],['Keyboard',1]],
  other:[['Motherboard',3],['Power board',2],['Other',1]]
};
var GRADES={A:'Like new',B:'Good, minor wear',C:'Works, visible wear',D:'Faulty, repairable',E:'Very poor'};
var METHODS=['Cash','Telebirr','Bank'];
var EXP_CATS=['Spare parts','Used devices','Transport','Rent','Salaries','Utilities','Other'];
var STOCK_EXP=['Spare parts','Used devices'];
var REPAIR_STATUS=['received','diagnosing','waiting','ready','delivered'];
var REASONS_UNDO=['Wrong item','Wrong price','Customer returned it','Entered twice','Other'];
var REASONS_DISC=['Customer bargained','Bulk purchase','Small damage','Regular customer','Other'];
var REASONS_FIX=['Recount','Damaged','Lost or stolen','Returned to supplier','Other'];
var SLOW_OPTIONS=[7,14,30,45,60,90];

/* ---------- small helpers ---------- */
var uid=function(){return Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-3);};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});};
var fmt=function(n){return Math.round(Number(n)||0).toLocaleString('en-US');};
var num=function(v){var n=parseFloat(String(v==null?'':v).replace(/,/g,''));return isFinite(n)&&n>0?n:0;};
var $=function(s){return document.querySelector(s);};

function luhn(s){var sum=0,alt=false;for(var i=s.length-1;i>=0;i--){var n=s.charCodeAt(i)-48;if(alt){n*=2;if(n>9)n-=9;}sum+=n;alt=!alt;}return sum%10===0;}

function serialWarn(s,isPhone){
  if(!isPhone)return '';

  return '';
}
function serialInUse(s,ignoreUsedId){
  s=s.toLowerCase();
  return db.items.some(function(i){return i.serials.some(function(x){return x.toLowerCase()===s;});})||
         db.used.some(function(u){return u.id!==ignoreUsedId&&u.status==='stock'&&u.imei&&u.imei.toLowerCase()===s;});
}
function analyzeSerials(txt,isPhone,ignoreUsedId){
  var raw=String(txt||'').split(/[\n,;]+/).map(function(x){return x.trim();}).filter(Boolean),seen={},dupInput=[],list=[],inStock=[],warn=[];
  raw.forEach(function(x){var k=x.toLowerCase();if(seen[k]){dupInput.push(x);return;}seen[k]=1;list.push(x);if(serialInUse(x,ignoreUsedId))inStock.push(x);var w=serialWarn(x,isPhone);if(w)warn.push({s:x,w:w});});
  return {list:list,dupInput:dupInput,inStock:inStock,warn:warn};
}

function defaultSettings(){return {lang:'en',mode:'dark',palette:'violet',ui:3,bgStyle:'charcoal',cAccent:'',cBar:'#6EA8FE',textSize:'normal',slowDays:30,weekStart:1,backupAt:0};}
function emptyDb(){return {v:2,shop:'',demo:false,settings:defaultSettings(),items:[],used:[],parts:[],sales:[],repairs:[],expenses:[],activity:[],alertsDismissed:{},alertsSeen:{}};}
function guessDevCat(name,hasImei){
  var n=String(name||'').toLowerCase();
  if(/\btv\b|television|"|inch/.test(n)&&!/phone/.test(n))return 'tv';
  if(/laptop|computer|\bpc\b|macbook|latitude|thinkpad|desktop|notebook/.test(n))return 'computer';
  return hasImei?'phone':'other';
}
function guessPartCat(name,from){
  var n=String(name||'').toLowerCase();
  if(/power board|t-con|backlight|remote|main board/.test(n))return 'tv';
  if(/keyboard|\bram\b|ssd|hdd/.test(n))return 'computer';
  return from&&from.cat?from.cat:'phone';
}
function migrate(o){
  if(!o||typeof o!=='object'||!Array.isArray(o.items)||!Array.isArray(o.used)||!Array.isArray(o.parts)||!Array.isArray(o.sales))return null;
  var now=Date.now();
  ['repairs','expenses','activity'].forEach(function(k){if(!Array.isArray(o[k]))o[k]=[];});
  o.settings=extend(defaultSettings(),o.settings||{});
  o.alertsDismissed=o.alertsDismissed||{};o.alertsSeen=o.alertsSeen||{};
  if(typeof o.shop!=='string')o.shop='';
  o.items.forEach(function(i){
    i.serials=i.serials||[];i.qty=i.qty||0;i.cost=i.cost||0;i.price=i.price||0;if(i.reorder==null)i.reorder=5;
    if(!i.decision)i.decision=i.price>0?'priced':'undecided';if(!i.ts)i.ts=now;
  });
  o.used.forEach(function(u){
    u.buy=u.buy||0;u.ask=u.ask||0;if(!u.ts)u.ts=now;
    if(!u.cat)u.cat=guessDevCat(u.name,!!u.imei);
    if(!u.decision)u.decision=u.ask>0?'priced':(u.status==='stock'?'undecided':'priced');
    if(u.grade==='E'&&u.notes==='Taken apart')u.notes='';
  });
  o.parts.forEach(function(p){
    if(p.qty==null)p.qty=(p.status==='used'||p.status==='gone')?0:1;
    delete p.status;
    p.cost=p.cost||0;p.price=p.price||0;if(!p.ts)p.ts=now;
    if(!p.cat)p.cat=guessPartCat(p.name,find(o.used,p.fromId));
    if(!p.decision)p.decision=p.price>0?'priced':'undecided';
  });
  o.sales.forEach(function(s){
    if(s.voided==null)s.voided=false;
    if(!Array.isArray(s.payments))s.payments=[];
    if(s.discount==null)s.discount=0;
    if(s.balance==null)s.balance=0;
    if(s.subtotal==null)s.subtotal=s.price;
    if(!Array.isArray(s.lines)){
      s.legacy=true;s.lines=[];
      if(s.kind==='used'&&s.usedId)s.lines.push({kind:'used',refId:s.usedId,name:s.title,price:s.price,cost:s.price-s.profit,qty:1});
      else if(s.kind==='trade'&&s.itemId){s.lines.push({kind:'new',refId:s.itemId,name:s.title,serial:'',qty:1,price:s.price,cost:s.price-s.profit});}
      else if(s.kind==='new'&&s.itemId){var m=/ x(\d+)/.exec(s.title||'');var q=m?parseInt(m[1],10):1;s.lines.push({kind:'new',refId:s.itemId,name:s.title,serial:'',qty:q,price:q?s.price/q:s.price,cost:q?(s.price-s.profit)/q:0});}
      if(s.kind==='trade'&&s.usedId)s.trade={usedId:s.usedId,value:s.value||0};
    }
  });
  o.v=2;return o;
}
function load(){
  try{
    var s=localStorage.getItem(KEY);
    if(s){
      var o=JSON.parse(s);
      if(o&&o.v!==2){try{localStorage.setItem(KEY+'.before-v2',s);}catch(e){}}
      var m=migrate(o);if(m){m.settings=Object.assign(defaultSettings(),m.settings||{});if(m.settings.ui!==3){m.settings.ui=3;m.settings.palette='violet';m.settings.mode='dark';m.settings.bgStyle='charcoal';}return m;}
    }
  }catch(e){storageOK=false;}
  return null;
}

/* Shop Stock logic: stock numbers, sales, trade-ins, taking devices apart, undo, repairs, expenses, alerts, receipts, CSV. */

/* ---------- stock numbers ---------- */
var stock=function(i){return i.track==='serial'?i.serials.length:i.qty;};
var isLow=function(i){return i.decision!=='parts'&&stock(i)<=i.reorder;};
var slowDays=function(){return db.settings.slowDays||30;};
function lastSaleTs(itemId){var m=0;db.sales.forEach(function(s){if(s.voided)return;s.lines.forEach(function(l){if(l.kind==='new'&&l.refId===itemId&&s.ts>m)m=s.ts;});});return m;}
function idleSince(i){return Math.max(i.ts||0,lastSaleTs(i.id));}
function slowUsed(){return db.used.filter(function(u){return u.status==='stock'&&daysSince(u.ts)>=slowDays();}).sort(function(a,b){return a.ts-b.ts;});}
function slowNew(){return db.items.filter(function(i){return stock(i)>0&&i.decision!=='parts'&&daysSince(idleSince(i))>=slowDays();}).sort(function(a,b){return idleSince(a)-idleSince(b);});}
function slowParts(){return db.parts.filter(function(p){return p.qty>0&&daysSince(p.ts)>=slowDays();}).sort(function(a,b){return a.ts-b.ts;});}
var undecidedNew=function(){return db.items.filter(function(i){return i.decision==='undecided';});};
var undecidedUsed=function(){return db.used.filter(function(u){return u.status==='stock'&&u.decision==='undecided';});};
var undecidedParts=function(){return db.parts.filter(function(p){return p.qty>0&&p.decision==='undecided';});};
var usedInStock=function(){return db.used.filter(function(u){return u.status==='stock';});};
var partsInStock=function(){return db.parts.filter(function(p){return p.qty>0;});};
var partUnits=function(list){return sum(list,function(p){return p.qty;});};

/* ---------- sales: titles, tags, totals ---------- */
function lineLabel(l){
  var n=l.name;
  if(l.kind==='used')n+=' ('+T('used')+')';
  else if(l.kind==='part')n=T(l.name)+' ('+T('part')+')';
  if(l.qty>1)n+=' x'+l.qty;
  return n;
}
function saleTitle(s){
  if(s.legacy)return s.title||'';
  if(s.lines.length&&s.lines[0].kind==='repair')return T('Repair: {d}',{d:s.lines[0].name});
  if(s.trade&&s.lines.length)return T('{a} for {b}',{a:s.lines[0].name,b:s.trade.name||''});
  var ls=s.lines.map(lineLabel);
  if(ls.length<=2)return ls.join(' + ');
  return ls[0]+' '+T('+{n} more',{n:ls.length-1});
}
function saleTags(s){
  var t=[];
  if(s.voided)t.push({t:T('Reversed'),k:'bad'});
  if(s.trade)t.push({t:T('Trade-in'),k:'info'});
  else if(s.lines.length===1&&s.lines[0].kind==='repair')t.push({t:T('Repair'),k:'info'});
  else if(s.lines.length&&s.lines.every(function(l){return l.kind==='used';}))t.push({t:T('Used'),k:'gray'});
  else if(s.lines.length&&s.lines.every(function(l){return l.kind==='part';}))t.push({t:T('Part'),k:'gray'});
  if(s.discount>0)t.push({t:T('Discount'),k:'warn'});
  if(!s.voided&&s.balance>0)t.push({t:T('Owes {n}',{n:fmt(s.balance)}),k:'warn'});
  if(!s.voided&&saleBelowCost(s))t.push({t:T('Below cost'),k:'bad'});
  return t;
}
function saleBelowCost(s){return !s.trade&&s.lines.some(function(l){return l.kind!=='repair'&&l.cost>0&&l.price<l.cost;});}
function saleMatches(s,q){
  q=q.trim().toLowerCase();if(!q)return true;
  var hay=[saleTitle(s),s.customer,s.phone,s.method,s.kind,s.discountReason,fmt(s.price)].concat(s.lines.map(function(l){return l.name+' '+(l.serial||'');})).join(' ').toLowerCase();
  return q.split(/\s+/).every(function(w){return hay.indexOf(w)>=0;});
}
function salesBetween(a,b,withVoid){return db.sales.filter(function(s){return s.ts>=a&&s.ts<b&&(withVoid||!s.voided);}).sort(function(x,y){return y.ts-x.ts;});}
function cashInBetween(a,b){
  var c=0;
  db.sales.forEach(function(s){if(s.voided)return;if(s.ts>=a&&s.ts<b)c+=s.cash||0;(s.payments||[]).forEach(function(p){if(p.ts>=a&&p.ts<b)c+=p.amount;});});
  return c;
}
function totalsFor(list,a,b){return {value:sum(list,function(s){return s.price;}),profit:sum(list,function(s){return s.profit;}),count:list.length,cash:cashInBetween(a,b),owed:sum(list,function(s){return s.balance;})};}
function periodRange(p){
  var t=startOfDay(Date.now());
  if(p==='today')return [t,addDays(t,1)];
  if(p==='yesterday')return [addDays(t,-1),t];
  if(p==='week'){var w=weekStart(Date.now());return [w,addDays(w,7)];}
  if(p==='date'){var d=fromYmd(state.salesDate)||t;return [d,addDays(d,1)];}
  var f=fromYmd(state.salesFrom)||t,e=fromYmd(state.salesTo)||f;if(e<f){var x=f;f=e;e=x;}
  return [f,addDays(e,1)];
}
function periodLabel(p){
  var r=periodRange(p);
  if(p==='today')return T('Today');if(p==='yesterday')return T('Yesterday');
  if(p==='week')return T('This week');
  if(p==='date')return fmtDate(r[0]);
  return fmtDate(r[0])+' - '+fmtDate(r[1]-DAY);
}
function expensesBetween(a,b){return db.expenses.filter(function(e){return e.ts>=a&&e.ts<b;}).sort(function(x,y){return y.ts-x.ts;});}
function debtList(){return db.sales.filter(function(s){return !s.voided&&s.balance>0;}).sort(function(a,b){return a.ts-b.ts;});}

/* ---------- selling: the cart ---------- */
function cartTotals(c){
  var sub=sum(c.lines,function(l){return num(l.price)*l.qty;});
  var disc=Math.min(num(c.discount),sub),total=sub-disc,raw=String(c.paid==null?'':c.paid).trim();
  var paid=raw===''?total:Math.max(0,Math.min(parseFloat(raw.replace(/,/g,''))||0,total));
  return {sub:sub,disc:disc,total:total,paid:paid,balance:total-paid};
}
function lineRef(l){
  if(l.kind==='new')return find(db.items,l.refId);
  if(l.kind==='used')return find(db.used,l.refId);
  return find(db.parts,l.refId);
}
function cartError(c){
  if(!c.lines.length)return T('Add at least one item to the sale.');
  var tot=cartTotals(c),taken={};
  for(var i=0;i<c.lines.length;i++){
    var l=c.lines[i],r=lineRef(l),nm=l.name;
    if(!r)return T('{n} is no longer in stock.',{n:nm});
    if(l.kind==='new'){
      if(r.track==='serial'){
        if(!l.serial)return T('Choose the IMEI or serial number for {n}.',{n:nm});
        if(r.serials.indexOf(l.serial)<0)return T('{n} is no longer in stock.',{n:nm+' ('+l.serial+')'});
        if(taken[l.serial])return T('The same unit is in the sale twice: {n}.',{n:l.serial});
        taken[l.serial]=1;
      }else if(l.qty>r.qty)return T('Only {n} left in stock for {i}.',{n:r.qty,i:nm});
    }else if(l.kind==='used'){if(r.status!=='stock')return T('{n} is no longer in stock.',{n:nm});}
    else if(l.kind==='part'){if(l.qty>r.qty)return T('Only {n} left in stock for {i}.',{n:r.qty,i:nm});}
    if(num(l.price)<=0)return T('Enter a price for {n}.',{n:nm});
  }
  if(tot.disc>0&&!c.reason)return T('Choose a reason for the discount.');
  if(tot.balance>0&&!String(c.customer||'').trim())return T('Add the customer name when part of the payment is still owed.');
  return '';
}
function snapItem(i){return {name:i.name,cat:i.cat,track:i.track,price:i.price,cost:i.cost,reorder:i.reorder,decision:i.decision};}
function recordSale(){
  var c=state.cart,err=cartError(c);if(err)return {err:err};
  var now=Date.now(),id=uid(),tot=cartTotals(c),lines=[];
  c.lines.forEach(function(l){
    var line={kind:l.kind,refId:l.refId,name:l.name,serial:l.serial||'',qty:l.qty,price:num(l.price),cost:0},r=lineRef(l);
    if(l.kind==='new'){
      line.cost=r.cost;line.snap=snapItem(r);
      if(r.track==='serial')r.serials.splice(r.serials.indexOf(l.serial),1);else r.qty-=l.qty;
    }else if(l.kind==='used'){
      line.cost=r.buy;line.serial=r.imei||'';line.snap=clone(r);
      r.status='sold';r.soldPrice=line.price;r.soldAt=now;r.saleId=id;
    }else{
      line.cost=r.cost;line.snap=clone(r);r.qty-=l.qty;
    }
    lines.push(line);
  });
  var cost=sum(lines,function(l){return l.cost*l.qty;});
  var sale={id:id,ts:now,kind:lines.length===1?lines[0].kind:'sale',lines:lines,subtotal:tot.sub,discount:tot.disc,discountReason:tot.disc>0?c.reason:'',price:tot.total,cash:tot.paid,balance:tot.balance,payments:[],profit:tot.total-cost,method:c.method,customer:String(c.customer||'').trim(),phone:String(c.phone||'').trim(),voided:false};
  db.sales.push(sale);
  log('sale','Sale recorded: {t} for {p} Birr',{t:saleTitle(sale),p:fmt(sale.price)},now);
  if(tot.disc>0)log('sale','Discount of {d} Birr given on {t} ({r})',{d:fmt(tot.disc),t:saleTitle(sale),r:c.reason},now);
  if(tot.balance>0)log('money','{c} owes {n} Birr for {t}',{c:sale.customer,n:fmt(tot.balance),t:saleTitle(sale)},now);
  state.cart=freshCart();save();
  return {sale:sale};
}
function addPayment(s,amount,method){
  amount=Math.min(amount,s.balance);if(amount<=0)return false;
  s.payments.push({id:uid(),ts:Date.now(),amount:amount,method:method});s.balance-=amount;
  log('money','Payment of {n} Birr received from {c} for {t}',{n:fmt(amount),c:s.customer||T('a customer'),t:saleTitle(s)});save();return true;
}

/* ---------- trade-ins ---------- */
function tradeCalc(){
  var t=state.trade,it=find(db.items,t.itemId),price=num(t.price),value=num(t.value),miss=[];
  if(!t.name.trim())miss.push(T("the customer's device"));
  if(!it)miss.push(T('the new device'));
  else if(it.track==='serial'&&!t.serial)miss.push(T('which unit they take'));
  if(!value)miss.push(T('the trade-in value'));
  if(!price&&it)miss.push(T('the selling price'));
  return {it:it,price:price,value:value,diff:price-value,miss:miss};
}
function recordTrade(){
  var c=tradeCalc(),t=state.trade;if(c.miss.length)return {err:T('Still needed: {n}.',{n:c.miss.join(', ')})};
  var it=c.it,now=Date.now();
  if(it.track==='serial'){var ix=it.serials.indexOf(t.serial);if(ix<0)return {err:T('That unit is no longer in stock.')};}
  else if(it.qty<1)return {err:T('{n} is no longer in stock.',{n:it.name})};
  var imei=t.imei.trim();
  if(imei&&serialInUse(imei))return {err:T('That IMEI or serial number is already in your stock: {n}',{n:imei})};
  var sid=uid(),did=uid(),ask=num(t.ask);
  var line={kind:'new',refId:it.id,name:it.name,serial:t.serial||'',qty:1,price:c.price,cost:it.cost,snap:snapItem(it)};
  if(it.track==='serial')it.serials.splice(it.serials.indexOf(t.serial),1);else it.qty-=1;
  var dev={id:did,name:t.name.trim(),cat:t.cat,imei:imei,grade:t.grade,buy:c.value,ask:ask,decision:ask>0?'priced':'undecided',notes:t.customer.trim()?T('Customer: {n}',{n:t.customer.trim()}):'',status:'stock',ts:now,source:'trade-in',tradeSaleId:sid};
  db.used.push(dev);
  var sale={id:sid,ts:now,kind:'trade',lines:[line],trade:{usedId:did,value:c.value,name:dev.name},subtotal:c.price,discount:0,price:c.price,cash:c.diff,balance:0,payments:[],profit:c.price-it.cost,method:t.method,customer:t.customer.trim(),phone:'',voided:false};
  db.sales.push(sale);
  log('trade','Trade-in: {a} came in for {b}',{a:dev.name,b:it.name},now);
  save();return {sale:sale,dev:dev};
}

/* ---------- undo (reverse a sale, undo a take-apart). All steps are collected so they can be previewed first. ---------- */
function removeUsed(d){
  db.used=db.used.filter(function(u){return u.id!==d.id;});
  db.expenses=db.expenses.filter(function(e){return !(e.ref&&e.ref.t==='used'&&e.ref.id===d.id);});
}
function syncRepairSale(r){
  if(!r.saleId)return;var s=find(db.sales,r.saleId);if(!s||!s.lines.length)return;
  var cost=sum(r.parts,function(p){return p.qty*p.cost;})+(r.otherCost||0);
  s.lines[0].cost=cost;s.profit=s.price-cost;
}
function reverseSale(s,ctx){
  if(!s||s.voided||ctx.seen[s.id])return;
  ctx.seen[s.id]=1;var S=ctx.steps;
  S.push(T('Reverse the sale: {t}',{t:saleTitle(s)}));
  if(s.trade){
    var d=find(db.used,s.trade.usedId);
    if(d){
      if(d.status==='sold'){
        var s2=null;db.sales.forEach(function(x){if(!s2&&!x.voided&&x!==s&&x.lines.some(function(l){return l.kind==='used'&&l.refId===d.id;}))s2=x;});
        if(s2)reverseSale(s2,ctx);else d.status='stock';
      }
      if(d.status==='parts')undoTakeApart(d,ctx);
      S.push(T('Remove {n} from used stock',{n:d.name}));removeUsed(d);
    }
  }
  s.lines.forEach(function(l){
    if(l.kind==='new'){
      var it=find(db.items,l.refId);
      if(!it){it=extend({id:l.refId,serials:[],qty:0,ts:Date.now()},l.snap||{name:l.name,cat:'Accessories',track:l.serial?'serial':'qty',price:l.price,cost:l.cost,reorder:5,decision:'priced'});db.items.push(it);S.push(T('Create {n} again (it had been deleted)',{n:it.name}));}
      if(it.track==='serial'){
        if(l.serial){if(serialInUse(l.serial))S.push(T('{n} is already in stock again, so it is not added twice',{n:l.serial}));else{it.serials.push(l.serial);S.push(T('Put {n} back in stock',{n:it.name+' ('+l.serial+')'}));}}
        else S.push(T('The IMEI of {n} was not saved in this older sale. Add it again with Add stock.',{n:it.name}));
      }else{it.qty+=l.qty;S.push(T('Put {n} back in stock',{n:it.name+' x'+l.qty}));}
    }else if(l.kind==='used'){
      var d2=find(db.used,l.refId);
      if(!d2&&l.snap){d2=clone(l.snap);db.used.push(d2);}
      if(d2){d2.status='stock';delete d2.soldPrice;delete d2.soldAt;delete d2.saleId;S.push(T('Put {n} back in used stock',{n:d2.name}));}
    }else if(l.kind==='part'){
      var p=find(db.parts,l.refId);
      if(!p&&l.snap){p=clone(l.snap);p.qty=0;db.parts.push(p);}
      if(p){p.qty+=l.qty;S.push(T('Put {n} back in spare parts',{n:T(p.name)+(l.qty>1?' x'+l.qty:'')}));}
    }else if(l.kind==='repair'){
      var r=find(db.repairs,l.refId);
      if(r){r.status='ready';r.saleId=null;r.deliveredAt=null;S.push(T('The repair for {c} goes back to Ready',{c:r.customer||r.device}));}
    }
  });
  if(ctx.top===s.id){
    var back=(s.cash||0)+sum(s.payments,function(p){return p.amount;});
    if(back>0)S.push(T('Give {n} Birr back to the customer',{n:fmt(back)}));
    else if(back<0)S.push(T('The customer gives back {n} Birr that you paid out',{n:fmt(-back)}));
  }
  s.voided=true;s.voidedAt=Date.now();s.voidReason=ctx.reason||'';
  log('undo','Sale reversed: {t} ({r})',{t:saleTitle(s),r:ctx.reason?T(ctx.reason):'-'});
}
function undoTakeApart(d,ctx){
  var ps=db.parts.filter(function(p){return p.fromId===d.id;});
  ps.forEach(function(p){
    db.sales.slice().forEach(function(x){if(!x.voided&&x.lines.some(function(l){return l.kind==='part'&&l.refId===p.id;}))reverseSale(x,ctx);});
    db.repairs.forEach(function(r){
      var keep=[],removed=false;
      r.parts.forEach(function(rp){if(rp.partId===p.id){removed=true;ctx.steps.push(T('Take {n} out of the repair for {c}',{n:T(p.name),c:r.customer||r.device}));}else keep.push(rp);});
      if(removed){r.parts=keep;syncRepairSale(r);}
    });
  });
  db.parts=db.parts.filter(function(p){return p.fromId!==d.id;});
  ctx.steps.push(T('Remove the {n} parts taken from {d}',{n:ps.length,d:d.name}));
  d.status='stock';delete d.partedAt;
  ctx.steps.push(T('{d} goes back to used stock',{d:d.name}));
  log('undo','Take-apart undone: {d}',{d:d.name});
}
function previewRun(fn){
  var keep=db,ctx={steps:[],seen:{},ts:Date.now(),reason:'',top:null};
  db=clone(keep);
  try{fn(ctx);}finally{db=keep;}
  return ctx;
}
function realRun(fn,reason){
  var backup=clone(db),ctx={steps:[],seen:{},ts:Date.now(),reason:reason||'',top:null};
  try{fn(ctx);save();}catch(e){db=backup;throw e;}
  return ctx;
}
var undoSaleFn=function(id){return function(ctx){ctx.top=id;reverseSale(find(db.sales,id),ctx);};};
var undoApartFn=function(id){return function(ctx){var d=find(db.used,id);if(d&&d.status==='parts')undoTakeApart(d,ctx);};};
var previewUndoSale=function(id){return previewRun(undoSaleFn(id));};
var previewUndoApart=function(id){return previewRun(undoApartFn(id));};

/* ---------- taking a device apart ---------- */
function apartCosts(){
  var a=state.apart,dev=find(db.used,a.deviceId),rows=a.rows.filter(function(r){return r.name.trim();});
  var tot=sum(rows,function(r){return num(r.share)||1;}),left=dev?dev.buy:0,out={};
  rows.forEach(function(r,idx){var c=idx===rows.length-1?left:Math.round((dev?dev.buy:0)*(num(r.share)||1)/tot);left-=c;out[r.key]=c;});
  return out;
}
function apartDefaults(cat){return (APART_DEFAULTS[cat]||APART_DEFAULTS.other).map(function(x){return {key:uid(),name:x[0],state:'untested',share:String(x[1])};});}
function takeApart(){
  var a=state.apart,dev=find(db.used,a.deviceId);
  if(!dev||dev.status!=='stock')return T('Choose a device.');
  var rows=a.rows.filter(function(r){return r.name.trim();});
  if(!rows.length)return T('List at least one part.');
  var costs=apartCosts(),now=Date.now();
  rows.forEach(function(r){db.parts.push({id:uid(),name:r.name.trim(),cat:dev.cat,state:r.state,cost:costs[r.key],price:0,decision:'undecided',qty:1,from:dev.name,fromId:dev.id,ts:now});});
  dev.status='parts';dev.partedAt=now;
  log('part','Took apart {d}: {n} parts added',{d:dev.name,n:rows.length},now);
  save();return '';
}

/* ---------- repairs ---------- */
function repairPartsCost(r){return sum(r.parts,function(p){return p.qty*p.cost;});}
function useInRepair(partId,repairId,qty){
  var p=find(db.parts,partId),r=find(db.repairs,repairId);
  if(!p||!r)return T('Choose a repair job.');
  qty=Math.floor(qty);if(qty<1)return T('Enter how many you used.');if(qty>p.qty)return T('Only {n} left in stock for {i}.',{n:p.qty,i:T(p.name)});
  p.qty-=qty;
  var ex=null;r.parts.forEach(function(x){if(x.partId===p.id)ex=x;});
  if(ex)ex.qty+=qty;else r.parts.push({partId:p.id,name:p.name,cat:p.cat,qty:qty,cost:p.cost});
  syncRepairSale(r);
  log('part','{n} used in the repair for {c}',{n:T(p.name)+(qty>1?' x'+qty:''),c:r.customer||r.device});
  save();return '';
}
function removePartFromRepair(r,idx){
  var rp=r.parts[idx];if(!rp)return;
  var p=find(db.parts,rp.partId);
  if(p)p.qty+=rp.qty;else db.parts.push({id:rp.partId,name:rp.name,cat:rp.cat||'phone',state:'untested',cost:rp.cost,price:0,decision:'undecided',qty:rp.qty,from:'',fromId:'',ts:Date.now()});
  r.parts.splice(idx,1);syncRepairSale(r);
  log('part','{n} taken out of the repair for {c}',{n:T(rp.name),c:r.customer||r.device});save();
}
function deliverRepair(r,fee,method,paid,other){
  var now=Date.now(),cost=repairPartsCost(r)+other,sid=uid();
  paid=Math.max(0,Math.min(paid,fee));
  var sale={id:sid,ts:now,kind:'repair',lines:[{kind:'repair',refId:r.id,name:r.device,qty:1,price:fee,cost:cost}],subtotal:fee,discount:0,price:fee,cash:paid,balance:fee-paid,payments:[],profit:fee-cost,method:method,customer:r.customer||'',phone:r.phone||'',voided:false};
  db.sales.push(sale);
  r.status='delivered';r.deliveredAt=now;r.fee=fee;r.method=method;r.otherCost=other;r.saleId=sid;
  log('repair','Repair delivered: {d} for {c}, {p} Birr',{d:r.device,c:r.customer||'-',p:fmt(fee)},now);
  save();return sale;
}

/* ---------- stock corrections ---------- */
function correctQty(it,newQty,reason,label){
  var old=it.qty;it.qty=newQty;
  log('fix','Stock corrected: {n} from {a} to {b} ({r})',{n:label||it.name,a:old,b:newQty,r:T(reason)});save();
}
function removeUnit(it,serial,reason){
  var ix=it.serials.indexOf(serial);if(ix<0)return;it.serials.splice(ix,1);
  log('fix','Unit removed from stock: {n} {s} ({r})',{n:it.name,s:serial,r:T(reason)});save();

/* ---------- notifications (calculated from the data, so they disappear when the problem is fixed) ---------- */
function computeAlerts(){
  var out=[],now=Date.now();
  db.items.forEach(function(i){
    if(!isLow(i))return;var s=stock(i);
    out.push({key:'low:'+i.id,sev:s===0?'bad':'warn',t:i.name,s:s===0?T('Out of stock'):T('{n} left, reorder at {r}',{n:s,r:i.reorder}),go:{a:'item',id:i.id}});
  });
  var su=slowUsed().length,sn=slowNew().length,sp=slowParts().length;
  if(su+sn+sp>0)out.push({key:'slow',sev:'warn',t:T('{n} items unsold for {d}+ days',{n:su+sn+sp,d:slowDays()}),s:T('{a} used, {b} new, {c} parts',{a:su,b:sn,c:sp}),go:{a:'page',v:'slow'}});
  var un=undecidedNew().length+undecidedUsed().length+undecidedParts().length;
  if(un>0)out.push({key:'undecided',sev:'info',t:T('{n} items have no price decision yet',{n:un}),s:T('Set a price, keep them undecided, or mark them as parts.'),go:{a:'undecided'}});
  var debts=debtList();
  if(debts.length){var owed=sum(debts,function(s){return s.balance;});out.push({key:'debts',sev:'warn',t:T('Customers owe you {n} Birr',{n:fmt(owed)}),s:T('{n} unpaid sales',{n:debts.length}),go:{a:'page',v:'debts'}});}
  db.repairs.forEach(function(r){
    if(r.status==='ready'&&r.readyAt&&daysSince(r.readyAt)>=3)out.push({key:'rdy:'+r.id,sev:'warn',t:T('{d} is ready for pickup',{d:r.device}),s:T('{c} has not collected it for {n} days',{c:r.customer||T('The customer'),n:daysSince(r.readyAt)}),go:{a:'repair',id:r.id}});
    else if(r.status==='waiting'&&daysSince(r.ts)>=5)out.push({key:'wait:'+r.id,sev:'info',t:T('{d} is still waiting for parts',{d:r.device}),s:T('Open for {n} days',{n:daysSince(r.ts)}),go:{a:'repair',id:r.id}});
  });
  db.sales.forEach(function(s){
    if(now-s.ts>3*DAY)return;
    if(s.voided){if(s.voidedAt&&now-s.voidedAt<=3*DAY)out.push({key:'void:'+s.id,sev:'info',t:T('A sale was reversed'),s:saleTitle(s),go:{a:'sale',id:s.id}});return;}
    if(saleBelowCost(s))out.push({key:'cost:'+s.id,sev:'warn',t:T('Sold below cost'),s:saleTitle(s)+' - '+fmt(s.price)+' Birr',go:{a:'sale',id:s.id}});
    else if(s.discount>0&&s.discount>=0.1*s.subtotal)out.push({key:'disc:'+s.id,sev:'info',t:T('Large discount given'),s:saleTitle(s)+' - '+fmt(s.discount)+' Birr ('+T(s.discountReason)+')',go:{a:'sale',id:s.id}});
  });
  var hasData=db.items.length+db.used.length+db.sales.length>0;
  if(!db.demo&&hasData&&(!db.settings.backupAt||daysSince(db.settings.backupAt)>=7))out.push({key:'backup',sev:'info',t:T('Back up your data'),s:db.settings.backupAt?T('Last backup was {n} days ago.',{n:daysSince(db.settings.backupAt)}):T('You have not made a backup yet.'),go:{a:'page',v:'settings'}});
  var order={bad:0,warn:1,info:2};
  return out.sort(function(a,b){return order[a.sev]-order[b.sev];});
}
function visibleAlerts(){var now=Date.now();return computeAlerts().filter(function(a){var d=db.alertsDismissed[a.key];return !d||now-d>DAY;});}
function unseenAlerts(){return visibleAlerts().filter(function(a){return !db.alertsSeen[a.key];});}
function markAlertsSeen(){var keys={};visibleAlerts().forEach(function(a){keys[a.key]=1;});db.alertsSeen=keys;save();}

/* ---------- receipt, CSV, files ---------- */
function receiptText(s){
  var L=[],shop=db.shop||T('Your shop');
  L.push(shop);L.push(fmtDate(s.ts)+' '+tfmt(s.ts));L.push('------------------------');
  s.lines.forEach(function(l){
    L.push(lineLabel(l).replace(/ x\d+$/,'')+(l.qty>1?' x'+l.qty:''));
    if(l.serial)L.push('  IMEI/SN: '+l.serial);

  });
  if(s.trade)L.push(T('Trade-in: {n}',{n:s.trade.name})+' -'+fmt(s.trade.value));
  L.push('------------------------');

function csvCell(v){v=v==null?'':String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}
function toCsv(rows){return '﻿'+rows.map(function(r){return r.map(csvCell).join(',');}).join('\r\n');}

function downloadFile(name,text,mime){
  try{
    var blob=new Blob([text],{type:mime||'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');

function dayGroups(list,rowFn,tsOf){

}

function actList(){
  var q=state.actQ.trim().toLowerCase(),g=state.actFilter,list=db.activity.slice().sort(function(a,b){return b.ts-a.ts;});

/* Shop Stock sheets (part 1): stock items, used devices, spare parts, and their forms. Each sheet returns {title, body} or null when its record is gone. */
var SHEETS={};
var DEC_LABEL={priced:'Priced',undecided:'Undecided',parts:'For parts'};
var PART_STATES=['tested','untested','faulty'];

function btn(a,label,cls,o){
  o=o||{};
  return '<button type="button" class="btn'+(cls?' '+cls:'')+' wide" data-a="'+a+'"'+(o.id?' data-id="'+esc(o.id)+'"':'')+(o.v!=null?' data-v="'+esc(o.v)+'"':'')+(o.dis?' disabled':'')+'>'+(o.icon?ic(o.icon,18,2):'')+esc(label)+'</button>';
}
function btn2(a,b){return '<div class="btns">'+a+b+'</div>';}
function decSeg(allowParts){
  var o=[{v:'priced',t:T('Set a price')},{v:'undecided',t:T('Undecided')}];
  if(allowParts)o.push({v:'parts',t:T('For parts')});
  return '<div><div class="field" style="margin-bottom:6px">'+esc(T('Price decision'))+'</div>'+segHtml(o,F('f_dec','priced'),'fDec')+'</div>';
}
function methSeg(){return '<div><div class="field" style="margin-bottom:6px">'+esc(T('Paid by'))+'</div>'+segHtml(methodOpts(),F('f_m','Cash'),'fMeth')+'</div>';}
function chkHtml(txt,isPhone,ign){
  var a=analyzeSerials(txt,isPhone,ign),out='';
  if(!a.list.length&&!a.dupInput.length)return '';
  var hard=a.dupInput.length||a.inStock.length;
  out+='<div class="'+(hard?'err':a.warn.length?'warnbox':'okbox')+'" style="font-weight:600">'+esc(T('{n} numbers entered',{n:a.list.length}))+'</div>';
  var more=function(l){return l.slice(0,3).join(', ')+(l.length>3?' ...':'');};
  if(a.dupInput.length)out+='<div class="err">'+esc(T('Repeated in your list: {n}',{n:more(a.dupInput)}))+'</div>';
  if(a.inStock.length)out+='<div class="err">'+esc(T('Already in your stock: {n}',{n:more(a.inStock)}))+'</div>';
  a.warn.slice(0,3).forEach(function(w){out+='<div class="warnbox">'+esc(w.w==='len'?T('{s} should have 15 digits but has {n}.',{s:w.s,n:w.s.length}):T('{s} does not pass the IMEI check. Please check for a typo.',{s:w.s}))+'</div>';});
  return out;
}
function applyDecision(k,r,dec,price){
  var key=k==='used'?'ask':'price',old=r[key]||0,od=r.decision,nm=k==='part'?T(r.name):r.name;
  if(dec==='priced'){r[key]=price;r.decision='priced';if(old!==price)log('price','Price changed: {n} from {a} to {b} Birr',{n:nm,a:old?fmt(old):'-',b:fmt(price)});}
  else{r[key]=0;r.decision=dec;if(od!==dec)log('decision','{n} is now marked: {d}',{n:nm,d:T(DEC_LABEL[dec])});}
}
function unitFilterBox(){return '<label class="search">'+ic(I.search,20)+'<input id="ufilter" type="search" placeholder="'+esc(T('Search IMEI or serial'))+'" aria-label="'+esc(T('Search IMEI or serial'))+'" data-live="unitFilter" autocomplete="off"></label>';}

/* ---------- new item: details ---------- */
SHEETS.item=function(s){
  var i=find(db.items,s.id);if(!i)return null;
  var n=stock(i),tags=[];
  if(i.decision==='parts')tags.push({t:T('For parts'),k:'gray'});
  else if(i.decision==='undecided'||!i.price)tags.push({t:T('Price undecided'),k:'warn'});
  if(isLow(i))tags.push({t:n===0?T('Out of stock'):T('Low stock'),k:'bad'});
  var last=lastSaleTs(i.id),body=tagsHtml(tags)+'<div>'+kv(T('Category'),esc(T(i.cat)))+kv(T('Selling price'),priceText(i.price,i.decision))+kv(T('Cost'),'<b class="num">'+fmt(i.cost)+'</b>')+kv(T('In stock'),'<b class="num">'+n+'</b>')+kv(T('Reorder at'),'<span class="num">'+i.reorder+'</span>')+kv(T('Last sale'),last?esc(dayLabel(last)):esc(T('Never')))+kv(T('Tracked by'),esc(i.track==='serial'?T('IMEI or serial'):T('Quantity')))+'</div>';
  if(i.track==='serial'&&n){
    body+='<div class="field">'+esc(T('IMEI or serial numbers'))+' ('+n+')</div>'+(n>6?unitFilterBox():'')+'<div class="unitlist">'+i.serials.map(function(x){return '<div class="unit" data-s="'+esc(x.toLowerCase())+'"><span class="mono" style="flex:1">'+esc(x)+'</span><button type="button" class="btn sm" data-a="unitRemove" data-id="'+i.id+'" data-v="'+esc(x)+'">'+esc(T('Remove'))+'</button></div>';}).join('')+'</div>';
  }
  body+='<div class="form">'+btn('sellItem',T('Sell'),'primary',{id:i.id,dis:!(n>0&&i.decision!=='parts'),icon:I.receipt})+
    btn2(btn('restock',T('Add stock'),'',{id:i.id}),btn('itemEdit',T('Edit'),'',{id:i.id}))+
    btn('decide',T('Set price or status'),'',{id:i.id,v:'item'})+
    (i.track==='qty'?btn('correct',T('Correct the count'),'',{id:i.id,v:'item'}):'')+
    btn('itemDel',T('Delete this item'),'danger',{id:i.id})+'</div>';
  return {title:i.name,body:body};
};

/* ---------- new item: add or edit ---------- */

SHEETS.itemForm=function(s){
  var i=s.id?find(db.items,s.id):null;if(s.id&&!i)return null;

    else body+=fInput('f_qty',T('Quantity in stock'),{im:'numeric'});

function itemSave(){
  var s=state.sheet,i=s.id?find(db.items,s.id):null,f=state.f,now=Date.now();
  var name=(f.f_name||'').trim(),dec=f.f_dec||'priced',price=num(f.f_price),cost=num(f.f_cost);
  var reorder=String(f.f_reorder==null?'':f.f_reorder).trim()===''?5:Math.floor(num(f.f_reorder));
  if(!name)return showErr(T('Enter a name.'));
  if(dec==='priced'&&!price)return showErr(T('Enter a selling price, or choose Undecided.'));
  if(!cost)return showErr(T('Enter what you paid for each unit.'));
  if(i){
    i.name=name;i.cat=f.f_cat;i.cost=cost;i.reorder=reorder;applyDecision('item',i,dec,price);
    save();toast(T('Saved'));openSheet({t:'item',id:i.id});return;
  }
  var track=f.f_track||'serial',serials=[],qty=0;
  if(track==='serial'){
    var a=analyzeSerials(f.f_serials,f.f_cat==='Phones');
    if(a.dupInput.length)return showErr(T('Repeated in your list: {n}',{n:a.dupInput.join(', ')}));
    if(a.inStock.length)return showErr(T('Already in your stock: {n}',{n:a.inStock.join(', ')}));
    if(a.warn.length&&!f._ack){f._ack=1;return showErr(T('Some numbers look wrong. Tap Save again to keep them anyway.'));}
    serials=a.list;
  }else qty=Math.floor(num(f.f_qty));
  var it={id:uid(),name:name,cat:f.f_cat,track:track,price:dec==='priced'?price:0,cost:cost,reorder:reorder,serials:serials,qty:qty,decision:dec,ts:now};
  db.items.push(it);
  log('stock','Item added: {n} ({q} in stock)',{n:name,q:track==='serial'?serials.length:qty},now);
  save();state.sheet=null;state.tab='stock';state.stockTab='new';state.newCat='All';state.q='';toast(T('Item added'));
}

function restockSave(id){
  var i=find(db.items,id),f=state.f;if(!i)return;
  if(i.track==='serial'){
    var a=analyzeSerials(f.f_serials,i.cat==='Phones');
    if(!a.list.length)return showErr(T('Enter at least one IMEI or serial number.'));

    if(a.inStock.length)return showErr(T('Already in your stock: {n}',{n:a.inStock.join(', ')}));

    fInput('f_newqty',T('Real count'),{im:'numeric',def:String(r.qty)})+
    fSelect('f_reason',T('Reason'),[{v:'',t:T('Choose a reason')}].concat(optsFrom(REASONS_FIX)),{})+
    errBox()+btn('correctSave',T('Save correction'),'primary',{id:r.id,v:s.k})+'</div>';

};
function correctSave(id,k){
  var r=k==='part'?find(db.parts,id):find(db.items,id),f=state.f;if(!r)return;
  var raw=String(f.f_newqty==null?r.qty:f.f_newqty).trim();

function cartTaken(skipIdx){var t={};state.cart.lines.forEach(function(l,i){if(i!==skipIdx&&l.serial)t[l.serial]=1;});return t;}
function pickList(){
  var q=String(F('f_pq','')).trim().toLowerCase(),tab=state.pickTab,rows='';
  if(tab==='new'){
    db.items.filter(function(i){return stock(i)>0&&i.decision!=='parts'&&(!q||(i.name+' '+i.serials.join(' ')).toLowerCase().indexOf(q)>=0);}).forEach(function(i){
      rows+='<button type="button" class="row" data-a="pickItem" data-k="new" data-id="'+i.id+'"><span class="grow"><b>'+esc(i.name)+'</b><small>'+stock(i)+' '+esc(T('in stock'))+'</small></span><span class="end">'+priceText(i.price,i.decision)+'</span></button>';
    });
  }else if(tab==='used'){
    db.used.filter(function(u){return u.status==='stock'&&!inCartUsed(u.id)&&(!q||(u.name+' '+(u.imei||'')).toLowerCase().indexOf(q)>=0);}).forEach(function(u){

    });

    db.parts.filter(function(p){return p.qty>0&&(!q||(p.name+' '+T(p.name)+' '+(p.from||'')).toLowerCase().indexOf(q)>=0);}).forEach(function(p){
      rows+='<button type="button" class="row" data-a="pickItem" data-k="part" data-id="'+p.id+'"><span class="grow"><b>'+esc(T(p.name))+'</b><small>'+esc(T(DEV_CAT_LABEL[p.cat]))+', '+p.qty+' '+esc(T('in stock'))+'</small></span><span class="end">'+priceText(p.price,p.decision==='parts'?'undecided':p.decision)+'</span></button>';

    unitListHtml(it,cur,multi,taken,'ufilter')+errBox()+btn('unitsGo',multi?T('Add to sale'):T('Use this unit'),'primary')+'</div>'};

function addToCart(kind,id,serial){
  var c=state.cart,ex=null;
  if(kind==='new'){
    var it=find(db.items,id);if(!it)return;
    if(it.track==='serial'){c.lines.push({kind:'new',refId:id,name:it.name,serial:serial||'',qty:1,price:it.price?String(it.price):''});return;}
    c.lines.forEach(function(l){if(l.kind==='new'&&l.refId===id)ex=l;});
    if(ex)ex.qty=Math.min(ex.qty+1,it.qty);else c.lines.push({kind:'new',refId:id,name:it.name,serial:'',qty:1,price:it.price?String(it.price):''});
  }else if(kind==='used'){
    var u=find(db.used,id);if(!u||inCartUsed(id))return;
    c.lines.push({kind:'used',refId:id,name:u.name,serial:u.imei||'',qty:1,price:u.ask?String(u.ask):''});
  }else{
    var p=find(db.parts,id);if(!p)return;
    c.lines.forEach(function(l){if(l.kind==='part'&&l.refId===id)ex=l;});
    if(ex)ex.qty=Math.min(ex.qty+1,p.qty);else c.lines.push({kind:'part',refId:id,name:p.name,serial:'',qty:1,price:p.price?String(p.price):''});
  }
}

/* ---------- navigation and the back button ---------- */
var histN=0,histIgnore=0;
function depth(){return (state.conf?1:0)+(state.sheet?1:0)+state.pages.length+(state.tab!=='home'?1:0)+(state.tab==='stock'&&state.stockTab==='parts'&&state.partCat!=null?1:0);}
function backOnce(){
  if(state.conf)state.conf=null;
  else if(state.sheet)state.sheet=null;
  else if(state.pages.length)state.pages.pop();
  else if(state.tab==='stock'&&state.stockTab==='parts'&&state.partCat!=null)state.partCat=null;
  else if(state.tab!=='home')state.tab='home';
}
function syncHist(){
  if(histIgnore>0)return;
  var d=depth();
  try{
    if(d>histN){while(histN<d){histN++;history.pushState({d:histN},'');}}
    else if(d<histN){var n=histN-d;histN=d;histIgnore++;history.go(-n);}
  }catch(e){}
}
window.addEventListener('popstate',function(e){
  if(histIgnore>0){histIgnore--;if(!histIgnore)syncHist();return;}
  histN=(e.state&&e.state.d)||0;
  var g=20;while(depth()>histN&&g-->0)backOnce();
  state.armed=null;render();
});
function openSheet(s,f){state.sheet=s;state.f=f||{};state.armed=null;render();}

/* ---------- taps ---------- */
function act(a,el){
  var id=el.getAttribute('data-id'),v=el.getAttribute('data-v'),k=el.getAttribute('data-k');
  if(a!=='resetAll')state.armed=null;
  switch(a){
    /* navigation */
    case 'tab':setTab(v);break;
    case 'quick':openSheet({t:'quick'});return false;
    case 'page':pushPage(v);break;
    case 'back':if(histN>0){history.back();return false;}backOnce();break;
    case 'closeSheet':state.sheet=null;break;
    case 'confNo':state.conf=null;break;
    case 'confYes':var fn=state.conf&&state.conf.fn;state.conf=null;if(fn)fn();break;
    case 'goSales':setTab('sales');state.salesPeriod=v;state.salesQ='';break;
    case 'goLow':setTab('stock');state.stockTab='new';state.newCat='Low';state.q='';break;
    case 'goUsed':setTab('stock');state.stockTab='used';break;
    case 'goParts':setTab('stock');state.stockTab='parts';state.partCat=null;break;
    case 'goRepair':setTab('repair');break;
    case 'openSale':pushPage('sale');break;
    case 'alertGo':var al=computeAlerts().filter(function(x){return x.key===k;})[0];if(al)goAlert(al.go);break;
    case 'alertHide':db.alertsDismissed[k]=Date.now();save();break;
    case 'shareReorder':shareText(reorderText(),T('Reorder list copied'));return false;
    /* open records */
    case 'sale':case 'item':case 'used':case 'part':case 'repair':case 'expense':openSheet({t:a,id:id});return false;
    case 'itemNew':openItemForm();return false;case 'usedNew':openUsedForm();return false;case 'partNew':openPartForm();return false;
    case 'repairNew':openRepairForm();return false;case 'expenseNew':openExpenseForm();return false;
    case 'itemEdit':openItemForm(id);return false;case 'usedEdit':openUsedForm(id);return false;case 'partEdit':openPartForm(id);return false;
    case 'repairEdit':openRepairForm(id);return false;case 'expenseEdit':openExpenseForm(id);return false;
    case 'restock':openSheet({t:'restock',id:id},{f_serials:'',f_qty:''});return false;
    case 'decide':openDecide(v,id);return false;
    case 'correct':openSheet({t:'correct',id:id,k:v},{});return false;
    case 'unitRemove':openSheet({t:'unitRemove',id:id,serial:v},{});return false;
    case 'apartOpen':openApart(id);return false;
    case 'undoApartOpen':openSheet({t:'undoApart',id:id},{});return false;
    case 'undoSaleOpen':openSheet({t:'undoSale',id:id},{f_reason:''});return false;
    case 'payOpen':var ps=find(db.sales,id);openSheet({t:'payment',id:id},{f_amt:String(ps.balance),f_m:'Cash'});return false;
    case 'useInRepair':openSheet({t:'useIn',partId:id},{f_rep:'',f_uq:'1'});return false;
    case 'useInRepairFor':openSheet({t:'useIn',repairId:id},{f_part:'',f_uq:'1'});return false;
    case 'deliverOpen':var rd=find(db.repairs,id);openSheet({t:'deliver',id:id},{f_fee:String(rd.estimate||''),f_oc:'',f_paid:'',f_m:'Cash'});return false;
    /* lists and filters */
    case 'stockTab':state.stockTab=v;break;
    case 'setNewCat':state.newCat=v;break;
    case 'setUsedStatus':state.usedStatus=v;break;
    case 'setUsedGrade':state.usedGrade=v;break;
    case 'partCat':state.partCat=v===''?null:v;state.partType='All';state.partQ='';break;
    case 'setPartStatus':state.partStatus=v;break;
    case 'setPartType':state.partType=v;break;
    case 'salesPeriod':state.salesPeriod=v;if(v==='date'&&!state.salesDate)state.salesDate=ymd(Date.now());if(v==='range'){if(!state.salesFrom)state.salesFrom=ymd(addDays(Date.now(),-6));if(!state.salesTo)state.salesTo=ymd(Date.now());}break;
    case 'toggleVoid':state.salesVoid=!state.salesVoid;break;
    case 'setRepairFilter':state.repairFilter=v;break;
    case 'setActFilter':state.actFilter=v;break;
    case 'expDay':var d=addDays(expDay(),Number(v));if(d>startOfDay(Date.now()))d=startOfDay(Date.now());state.expDate=ymd(d);break;
    case 'pickTab':state.pickTab=v;break;
    /* form helpers */
    case 'fGrade':state.f.f_grade=v;break;
    case 'fDec':state.f.f_dec=v;break;
    case 'fTrack':state.f.f_track=v;break;
    case 'fExp':state.f.f_exp=v;break;
    case 'fMeth':state.f.f_m=v;break;
    /* saving */
    case 'itemSave':return itemSave();
    case 'restockSave':return restockSave(id);
    case 'correctSave':return correctSave(id,v);
    case 'decideSave':return decideSave(id,v);
    case 'usedSave':return usedSave();
    case 'partSave':return partSave();
    case 'useInSave':return useInSave();
    case 'unitRemoveSave':
      var it=find(db.items,id);if(!state.f.f_reason)return showErr(T('Choose a reason.'));
      removeUnit(it,v,state.f.f_reason);toast(T('Unit removed'));openSheet({t:'item',id:id});return false;
    case 'apartAdd':state.apart.rows.push({key:uid(),name:'',state:'untested',share:'1'});break;
    case 'apartRm':state.apart.rows.splice(Number(v),1);break;
    case 'apartSave':
      var dv=find(db.used,state.apart.deviceId),er=takeApart();if(er)return showErr(er);
      state.sheet=null;state.apart=null;setTab('stock');state.stockTab='parts';state.partCat=dv.cat;state.partStatus='stock';state.partType='All';state.partQ='';toast(T('Parts added to stock'));break;
    case 'repairSave':return repairSave();
    case 'expenseSave':return expenseSave();
    case 'repairStatus':
      var sp=v.split('|'),rr=find(db.repairs,sp[1]);if(rr&&rr.status!==sp[0]){rr.status=sp[0];if(sp[0]==='ready')rr.readyAt=Date.now();log('repair','Repair status: {d} is now {s}',{d:rr.device,s:T(cap(sp[0]))});save();}
      break;
    case 'repairPartRm':var rp=find(db.repairs,id);if(rp)removePartFromRepair(rp,Number(v));break;
    case 'deliverGo':return deliverGo(id);
    case 'paySave':
      var sx=find(db.sales,id),amt=num(state.f.f_amt);if(!amt)return showErr(T('Enter the amount received.'));
      addPayment(sx,amt,state.f.f_m||'Cash');toast(T('Payment saved'));openSheet({t:'sale',id:id});return false;
    case 'undoSaleGo':
      if(!state.f.f_reason)return showErr(T('Choose a reason.'));
      try{realRun(undoSaleFn(id),state.f.f_reason);}catch(e){console.error(e);toast(T('Something went wrong. Nothing was changed.'));break;}
      toast(T('Sale reversed'));openSheet({t:'sale',id:id});return false;
    case 'undoApartGo':
      try{realRun(undoApartFn(id));}catch(e2){console.error(e2);toast(T('Something went wrong. Nothing was changed.'));break;}
      toast(T('Take apart undone'));openSheet({t:'used',id:id});return false;
    case 'shareReceipt':shareText(receiptText(find(db.sales,id)),T('Receipt copied'));return false;
    /* delete */
    case 'itemDel':var di=find(db.items,id);ask({title:T('Delete this item?'),msg:di.name,ok:T('Delete'),danger:true,fn:function(){db.items=db.items.filter(function(x){return x.id!==id;});log('stock','Item deleted: {n}',{n:di.name});save();state.sheet=null;toast(T('Deleted'));}});return false;
    case 'usedDel':var du=find(db.used,id);ask({title:T('Delete this device?'),msg:du.name,ok:T('Delete'),danger:true,fn:function(){removeUsed(du);log('used','Used device deleted: {n}',{n:du.name});save();state.sheet=null;toast(T('Deleted'));}});return false;
    case 'partDel':var dp=find(db.parts,id);ask({title:T('Delete this part?'),msg:T(dp.name),ok:T('Delete'),danger:true,fn:function(){db.parts=db.parts.filter(function(x){return x.id!==id;});log('part','Spare part deleted: {n}',{n:T(dp.name)});save();state.sheet=null;toast(T('Deleted'));}});return false;
    case 'expenseDel':var de=find(db.expenses,id);ask({title:T('Delete this expense?'),msg:(de.note||T(de.cat))+' - '+fmt(de.amount)+' '+T('Birr'),ok:T('Delete'),danger:true,fn:function(){db.expenses=db.expenses.filter(function(x){return x.id!==id;});log('expense','Expense deleted: {c}, {n} Birr',{c:T(de.cat)+(de.note?' - '+de.note:''),n:fmt(de.amount)});save();state.sheet=null;toast(T('Deleted'));}});return false;
    case 'repairDel':var dr=find(db.repairs,id);ask({title:T('Delete this repair?'),msg:dr.device,ok:T('Delete'),danger:true,fn:function(){for(var i=dr.parts.length-1;i>=0;i--)removePartFromRepair(dr,i);db.repairs=db.repairs.filter(function(x){return x.id!==id;});log('repair','Repair deleted: {d}',{d:dr.device});save();state.sheet=null;toast(T('Deleted'));}});return false;
    /* selling */
    case 'sellItem':
      var si=find(db.items,id);
      if(si.track==='serial'){openSheet({t:'units',id:id,idx:null,go:true},{});return false;}
      addToCart('new',id);ensureSalePage();toast(T('Added to the sale'));break;
    case 'sellUsed':addToCart('used',id);ensureSalePage();toast(T('Added to the sale'));break;
    case 'sellPart':addToCart('part',id);ensureSalePage();toast(T('Added to the sale'));break;
    case 'cartAdd':openSheet({t:'pick'},{f_pq:''});return false;
    case 'pickItem':
      if(k==='new'&&find(db.items,id).track==='serial'){openSheet({t:'units',id:id,idx:null,go:false},{});return false;}
      addToCart(k,id);state.sheet=null;toast(T('Added to the sale'));break;
    case 'unitsGo':
      var us=state.sheet,picked=[].map.call(document.querySelectorAll('#sheetRoot [data-unit]:checked'),function(x){return x.value;});
      if(!picked.length)return showErr(T('Choose at least one unit.'));
      if(us.idx!=null)state.cart.lines[us.idx].serial=picked[0];else picked.forEach(function(s){addToCart('new',us.id,s);});
      state.sheet=null;if(us.go)ensureSalePage();break;
    case 'cartRm':state.cart.lines.splice(Number(v),1);break;
    case 'cartQty':
      var pr=v.split(':'),ln=state.cart.lines[Number(pr[0])],rf=lineRef(ln),mx=rf?(ln.kind==='used'||(ln.kind==='new'&&rf.track==='serial')?1:rf.qty):1;
      ln.qty=Math.max(1,Math.min(ln.qty+Number(pr[1]),mx));break;
    case 'cartPick':openSheet({t:'units',id:state.cart.lines[Number(v)].refId,idx:Number(v)},{});return false;
    case 'cartMethod':state.cart.method=v;break;
    case 'cartGo':
      var ce=cartError(state.cart);if(ce)return showErr(ce,'cartErr');
      ask({title:T('Record this sale?'),msg:T('Are you sure you want to record this sale?'),html:cartSummaryHtml(),ok:T('Yes, record sale'),fn:doRecordSale});return false;
    case 'tradeGrade':state.trade.grade=v;break;
    case 'tradeMethod':state.trade.method=v;break;
    case 'tradeGo':
      var tc=tradeCalc();if(tc.miss.length)return showErr(T('Still needed: {n}.',{n:tc.miss.join(', ')}),'tradeErr');
      var ti=state.trade.imei.trim();if(ti&&serialInUse(ti))return showErr(T('That IMEI or serial number is already in your stock: {n}',{n:ti}),'tradeErr');
      ask({title:T('Confirm trade-in?'),msg:T('Are you sure you want to record this trade-in?'),html:tradeSummary(),ok:T('Yes, record it'),fn:doTrade});return false;
    /* settings */
    case 'setLang':db.settings.lang=v;save();applyTheme();break;
    case 'setBg':db.settings.bgStyle=v;save();applyTheme();render();break;
    case 'colReset':db.settings.cAccent='';db.settings.cBar='#6EA8FE';db.settings.bgStyle='charcoal';save();applyTheme();render();break;
    case 'setMode':db.settings.mode=v;save();applyTheme();break;
    case 'setPalette':db.settings.palette=v;save();applyTheme();break;
    case 'setSize':db.settings.textSize=v;save();applyTheme();break;
    case 'setWeek':db.settings.weekStart=Number(v);save();break;
    case 'downloadBackup':if(downloadFile('shop-stock-backup-'+ymd(Date.now())+'.json',JSON.stringify(db),'application/json')){backupStamp();toast(T('Backup file saved'));}else toast(T('Could not save the file. Use Copy backup text instead.'));break;
    case 'copyBackup':copyText(JSON.stringify(db),T('Backup copied'));backupStamp();break;
    case 'restore':var txt=(state.f.bk_in||'').trim();if(!txt)return showErr(T('Paste your backup text first.'));return restoreFrom(txt);
    case 'pickBackupFile':var bf=$('#bk_file');if(bf)bf.click();return false;
    case 'exportSales':
      var rg=periodRange(state.salesPeriod),sl=salesBetween(rg[0],rg[1],state.salesVoid);if(state.salesQ.trim())sl=sl.filter(function(s){return saleMatches(s,state.salesQ);});
      downloadFile('sales-'+ymd(rg[0])+'.csv',salesCsv(sl));return false;
    case 'exportAll':
      var csv=v==='sales'?salesCsv(db.sales.slice().sort(function(x,y){return x.ts-y.ts;})):v==='stock'?stockCsv():v==='expenses'?expensesCsv():repairsCsv();
      downloadFile(v+'-'+ymd(Date.now())+'.csv',csv);return false;
    case 'clearDemo':
      ask({title:T('Remove the example data?'),msg:T('Your own entries stay.'),ok:T('Remove'),danger:true,fn:function(){
        var keep=function(x){return !x.demo;};
        db.items=db.items.filter(keep);db.used=db.used.filter(keep);db.parts=db.parts.filter(keep);db.sales=db.sales.filter(keep);db.repairs=db.repairs.filter(keep);db.expenses=db.expenses.filter(keep);db.activity=db.activity.filter(keep);
        db.demo=false;save();toast(T('Example data removed'));
      }});return false;
    case 'resetAll':
      if(state.armed==='reset'){var keepSet=db.settings;db=emptyDb();db.settings=keepSet;save();setTab('home');state.trade=freshTrade();state.cart=freshCart();toast(T('Everything erased'));}
      else{state.armed='reset';clearTimeout(act.t);act.t=setTimeout(function(){if(state.armed==='reset'){state.armed=null;render();}},4000);}
      break;
    default:return false;
  }
}
document.addEventListener('click',function(e){
  var t=e.target;
  if(t.hasAttribute&&t.hasAttribute('data-scrim')){if(state.conf)state.conf=null;else state.sheet=null;render();return;}
  var el=t.closest?t.closest('[data-a]'):null;if(!el||el.disabled)return;
  var r;
  try{r=act(el.getAttribute('data-a'),el);}catch(err){console.error(err);toast(T('Something went wrong. Please try again.'));return;}
  if(r!==false)render();
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){if(state.conf)state.conf=null;else if(state.sheet)state.sheet=null;else return;render();}
});

/* ---------- repair, expense and delivery saves ---------- */
function repairSave(){
  var s=state.sheet,r=s.id?find(db.repairs,s.id):null,f=state.f,now=Date.now();
  var device=(f.f_dv||'').trim();if(!device)return showErr(T('Enter the device.'));
  var vals={customer:(f.f_cu||'').trim(),phone:(f.f_ph||'').trim(),device:device,imei:(f.f_im||'').trim(),problem:(f.f_pr||'').trim(),estimate:num(f.f_es),notes:(f.f_nt||'').trim()};
  if(r){extend(r,vals);save();toast(T('Saved'));openSheet({t:'repair',id:r.id});return false;}
  var nr=extend({id:uid(),ts:now,status:'received',parts:[],otherCost:0},vals);
  db.repairs.push(nr);log('repair','Repair received: {d} from {c}',{d:device,c:vals.customer||'-'},now);save();
  setTab('repair');state.repairFilter='open';state.repairQ='';toast(T('Repair added'));openSheet({t:'repair',id:nr.id});return false;
}
function expenseSave(){
  var s=state.sheet,e=s.id?find(db.expenses,s.id):null,f=state.f;
  var amt=num(f.f_amt);if(!amt)return showErr(T('Enter the amount.'));
  var day=fromYmd(f.f_date)||startOfDay(Date.now()),ts=e?e.ts:Date.now();
  if(!e||startOfDay(e.ts)!==day)ts=day===startOfDay(Date.now())?Date.now():day+43200000;
  var note=(f.f_note||'').trim();
  if(e){e.amount=amt;e.cat=f.f_cat;e.note=note;e.method=f.f_m||'Cash';e.ts=ts;log('expense','Expense changed: {c}, {n} Birr',{c:T(e.cat)+(note?' - '+note:''),n:fmt(amt)});save();toast(T('Saved'));openSheet({t:'expense',id:e.id});return false;}
  var ne={id:uid(),ts:ts,amount:amt,cat:f.f_cat,note:note,method:f.f_m||'Cash',ref:null};
  db.expenses.push(ne);log('expense','Expense recorded: {c}, {n} Birr',{c:T(ne.cat)+(note?' - '+note:''),n:fmt(amt)},ts);save();
  state.expDate=ymd(ts);state.sheet=null;toast(T('Expense saved'));
}
function deliverGo(id){
  var r=find(db.repairs,id),f=state.f,fee=num(f.f_fee);
  if(!fee)return showErr(T('Enter the final price.'));
  var raw=String(f.f_paid==null?'':f.f_paid).trim(),paid=raw===''?fee:Math.min(num(raw),fee);
  if(paid<fee&&!r.customer)return showErr(T('Add the customer name on the repair when part of the payment is still owed.'));
  var sale=deliverRepair(r,fee,f.f_m||'Cash',paid,num(f.f_oc));
  toast(T('Repair delivered'));openSheet({t:'sale',id:sale.id,done:T('Repair recorded as a sale.')});return false;
}

addEventListener('input',function(e){var c=e.target&&e.target.getAttribute&&e.target.getAttribute('data-col');if(c){db.settings[c]=e.target.value;save();applyTheme();}});
addEventListener('beforeinstallprompt',function(e){e.preventDefault();});

/* Shop Stock start-up. */
(function(){
  db=load();
  if(!db){db=seed();save();}
  applyTheme();
  try{history.replaceState({d:0},'');}catch(e){}
  try{var mq=window.matchMedia('(prefers-color-scheme: dark)');var f=function(){if(db.settings.mode==='auto'){applyTheme();render();}};if(mq.addEventListener)mq.addEventListener('change',f);}catch(e){}
  render();
  if(window.__REGISTER_SW__){try{if('serviceWorker' in navigator)window.addEventListener('load',function(){navigator.serviceWorker.register('./sw.js').catch(function(){});});}catch(e){}}
})();

})();
</script>
